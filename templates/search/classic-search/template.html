<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>{{siteName}}</title>


</head>


<body>


<div class="search">


<h1>

<span data-arg-slot="siteName">{{siteName}}</span>

</h1>



<form id="searchForm" data-arg-component="search">


<input id="keyword" data-arg-input="keyword" placeholder="{{placeholder}}">


<button data-arg-submit>

<span data-arg-slot="buttonText">{{buttonText}}</span>

</button>


</form>



<div id="result">

</div>


</div>



</body>


</html>
