<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日早报 · 特别号外</title>
</head>
<body>
  <div class="news-page">
    <div class="news-masthead">
      <div class="masthead-top">
        <span>第 10842 期</span>
        <span class="masthead-title">临 江 早 报</span>
        <span>特 别 号 外</span>
      </div>
      <div class="masthead-line"></div>
    </div>

    <div class="news-headline-card">
      <div class="breaking-tag">⚡ 案件全线告破 · 终局报道 ⚡</div>
      <div class="news-message" data-arg-slot="message">
        {{message}}
      </div>
    </div>

    <div class="news-footer">
      <span>临江日报社出版 · 感谢参与本次调查</span>
    </div>
  </div>
</body>
</html>
