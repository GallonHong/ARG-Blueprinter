<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>临江市公安局 · 结案判定书</title>
</head>
<body>
  <div class="verdict-page">
    <div class="verdict-seal-watermark">绝密归档</div>
    <div class="verdict-header">
      <div class="police-badge">临江市公安局 0717 特别专案组</div>
      <h1>刑 事 案 件 结 案 判 定 书</h1>
      <div class="verdict-sub">案卷编号：LJ-CRIM-20010717-FINAL</div>
    </div>

    <div class="verdict-body" data-arg-slot="message">
      {{message}}
    </div>

    <div class="verdict-stamp-area">
      <div class="stamp-box">
        <div class="red-stamp">【专案组·已结案】</div>
        <div class="stamp-date">档案已永久封存入库</div>
      </div>
    </div>
  </div>
</body>
</html>
