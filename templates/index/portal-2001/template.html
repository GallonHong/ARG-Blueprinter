<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{siteName}}</title>
</head>
<body>
  <div class="portal">
    <div class="logo">
      <span data-arg-slot="siteName">{{siteName}}</span>
    </div>
    <div class="nav">
      <span data-arg-slot="navigation">{{navigation}}</span>
    </div>
    <div class="news">
      <h2><span data-arg-slot="categoryTitle">{{categoryTitle}}</span></h2>
      <div data-arg-slot="links" class="portal-links">{{ARG_LINKS}}</div>
    </div>
  </div>
</body>
</html>
